<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LanSentinel</title>
<style>
  :root{
    --bg:#0e1217; --side:#0a0d11; --panel:#141a21; --panel-2:#1a222b; --panel-3:#222c37;
    --line:#232d38; --line-2:#2f3c4a;
    --fg:#e6eef7; --dim:#9fb0c1; --muted:#6d8094;
    --ok:#2ecc71; --warn:#f0a92b; --crit:#ff5468; --accent:#4c9aff; --violet:#a78bfa; --pink:#f472b6;
    --radius:10px; --sidebar-w:238px; --topbar-h:54px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);font-size:13px;line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .ic{width:16px;height:16px;flex:none;display:block}
  .is-hidden{display:none !important}
  .muted{color:var(--muted)}
  .link{color:var(--accent);text-decoration:none}
  .link:hover{text-decoration:underline}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2b3742;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- 侧栏 ---------- */
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:40;
    background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;transition:width .15s ease,transform .18s ease;
  }
  .brand{display:flex;align-items:center;gap:9px;padding:15px 14px 13px;text-decoration:none;color:var(--fg)}
  .brand .logo{width:26px;height:26px;flex:none;display:block}
  .brand .logo svg{width:100%;height:100%;display:block}
  .brand-t{font-size:14.5px;font-weight:500;letter-spacing:.3px;white-space:nowrap;overflow:hidden}
  .brand-t b{font-weight:700;color:var(--accent)}
  .nav{flex:1;overflow-y:auto;padding:6px 0 10px}
  .nav a{
    display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:7px;
    color:var(--dim);font-size:13px;text-decoration:none;position:relative;white-space:nowrap;
  }
  .nav a .ic{width:17px;height:17px;color:var(--muted)}
  .nav a:hover{background:var(--panel-2);color:var(--fg)}
  .nav a:hover .ic{color:var(--fg)}
  .nav a.active{background:var(--panel-2);color:var(--fg);font-weight:500}
  .nav a.active .ic{color:var(--accent)}
  .nav a.active::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--accent)}
  .nav-badge{margin-left:auto;background:rgba(255,84,104,.16);color:var(--crit);font-size:11px;font-weight:600;padding:0 6px;border-radius:9px;min-width:18px;text-align:center}
  .side-foot{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted)}
  .sf-row{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .sf-actions{margin-top:4px}
  .scrim{display:none;position:fixed;inset:0;background:rgba(4,7,10,.6);z-index:35}

  body.collapsed{--sidebar-w:64px}
  body.collapsed .nav-label,
  body.collapsed .brand-t,
  body.collapsed .side-foot{display:none}
  body.collapsed .nav a{justify-content:center;padding:10px 0}
  body.collapsed .nav a::before{display:none}
  body.collapsed .nav-badge{position:absolute;top:3px;right:8px;min-width:14px;padding:0 3px;font-size:10px}

  /* ---------- 顶栏 ---------- */
  .shell{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column;transition:margin-left .15s ease}
  .topbar{
    position:sticky;top:0;z-index:30;height:var(--topbar-h);flex:none;
    display:flex;align-items:center;gap:8px;padding:0 14px;
    background:rgba(14,18,23,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
  .crumb a{color:var(--muted);text-decoration:none}
  .crumb a:hover{color:var(--fg)}
  .crumb b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
  .crumb .sep{opacity:.45}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .health-pill{
    display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap;
    border:1px solid rgba(46,204,113,.3);background:rgba(46,204,113,.07);color:var(--ok);
  }
  .health-pill.warn{border-color:rgba(240,169,43,.32);background:rgba(240,169,43,.08);color:var(--warn)}
  .health-pill.crit{border-color:rgba(255,84,104,.32);background:rgba(255,84,104,.09);color:var(--crit)}

  .icon-btn{
    width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;flex:none;
    background:transparent;border:1px solid transparent;border-radius:7px;color:var(--dim);cursor:pointer;padding:0;
  }
  .icon-btn:hover{background:var(--panel-2);color:var(--fg);border-color:var(--line)}
  .hide-desk{display:none}
  .search{position:relative;display:flex}
  .search .ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
  .search input{
    width:200px;padding:6px 10px 6px 28px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--fg);font-size:12.5px;font-family:inherit;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:1px solid var(--accent);outline-offset:-1px}
  .sel{
    background:var(--panel-2);color:var(--fg);border:1px solid var(--line);border-radius:7px;
    padding:6px 8px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  .sel:focus{outline:1px solid var(--accent);outline-offset:-1px}

  /* ---------- 页面骨架 ---------- */
  main{padding:16px 18px 70px;width:100%;max-width:1680px;margin:0 auto}
  .sec-head{display:flex;align-items:center;gap:12px;margin:20px 0 10px}
  .sec-head:first-child{margin-top:2px}
  .sec-head h2{font-size:14px;margin:0;font-weight:600}
  .sec-head .muted{font-size:12px}
  .sec-head .link{margin-left:auto;font-size:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:6px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;position:relative;overflow:hidden}
  .tile::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line-2)}
  .tile.ok::after{background:var(--ok)} .tile.warn::after{background:var(--warn)}
  .tile.crit::after{background:var(--crit)} .tile.info::after{background:var(--accent)}
  .tile-k{font-size:11.5px;color:var(--muted)}
  .tile-v{font-size:25px;font-weight:600;line-height:1.15;margin-top:3px;font-variant-numeric:tabular-nums}
  .tile-s{font-size:11px;color:var(--muted);margin-top:2px}
  .empty{background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
  .empty a{color:var(--accent)}

  /* ---------- 节点卡 ---------- */
  .node-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .node-card{
    display:block;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px 10px;text-decoration:none;color:var(--fg);transition:border-color .15s,background .15s;
  }
  .node-card:hover{border-color:var(--line-2);background:var(--panel-2)}
  .node-card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:transparent}
  .node-card.warn::before{background:var(--warn)} .node-card.crit::before{background:var(--crit)}
  .nc-top{display:flex;align-items:center;gap:7px;min-width:0}
  .nc-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nc-sub{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nc-charts{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:9px}
  .mini{min-width:0}
  .mini-h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
  .mini-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini-h b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mini-c{height:44px;margin-top:1px}

  /* ---------- 通用小块 ---------- */
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
  .dot.online{background:var(--ok);box-shadow:0 0 6px rgba(46,204,113,.65)}
  .dot.stale{background:var(--warn)}
  .dot.offline{background:var(--crit)}
  .pill{font-size:11px;padding:1px 7px;border-radius:20px;border:1px solid var(--line-2);color:var(--dim);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:rgba(46,204,113,.35);background:rgba(46,204,113,.08)}
  .pill.warn{color:var(--warn);border-color:rgba(240,169,43,.35);background:rgba(240,169,43,.08)}
  .pill.crit{color:var(--crit);border-color:rgba(255,84,104,.35);background:rgba(255,84,104,.09)}
  .pill.info{color:var(--accent);border-color:rgba(76,154,255,.35);background:rgba(76,154,255,.08)}
  .chip{font-size:11px;padding:0 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
  .badge{font-size:11px;min-width:18px;text-align:center;padding:0 5px;border-radius:9px;font-weight:600}
  .badge.crit{background:rgba(255,84,104,.16);color:var(--crit)}
  .badge.warn{background:rgba(240,169,43,.16);color:var(--warn)}
  .mbar{display:block;height:4px;background:var(--panel-3);border-radius:2px;overflow:hidden;margin-top:4px}
  .mbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .mbar.warn i{background:var(--warn)} .mbar.crit i{background:var(--crit)}

  /* ---------- 按钮 / 表单 ---------- */
  .btn{
    background:var(--accent);color:#04121f;border:1px solid transparent;border-radius:7px;
    padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--panel-2);color:var(--fg);border-color:var(--line-2);font-weight:500}
  .btn.ghost:hover{border-color:var(--accent);filter:none}
  .btn.sm{padding:4px 10px;font-size:11.5px}
  .btn.danger{background:transparent;color:var(--crit);border-color:rgba(255,84,104,.3)}
  .btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
  .fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);min-width:0}
  .fld input{
    width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
    color:var(--fg);font-size:12.5px;font-family:inherit;
  }
  .fld input:focus{outline:1px solid var(--accent);outline-offset:-1px}
  .form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-3{display:grid;grid-template-columns:1.4fr .7fr 1.2fr;gap:12px}
  .hint{font-size:11px;color:var(--muted);margin-top:8px}
  .code{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin:10px 0;
    font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;max-height:46vh;overflow:auto;
  }
  code{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11.5px}

  /* ---------- 表格 ---------- */
  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:auto}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{
    position:sticky;top:0;z-index:1;background:var(--panel-2);color:var(--muted);font-weight:500;text-align:left;
    padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  .tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr:hover{background:var(--panel-2)}
  .tbl .c-sev{width:24px;padding-right:0}
  .tbl .c-num,.tbl .cell-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl .c-time{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tbl tr.is-resolved td{opacity:.55}
  .ev-t{font-size:12.5px}
  .ev-s{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
  .sev-mark{display:inline-block;width:7px;height:7px;border-radius:50%}
  .sev-mark.crit{background:var(--crit);box-shadow:0 0 6px rgba(255,84,104,.6)}
  .sev-mark.warn{background:var(--warn)}
  .node-link{font-weight:500}

  /* ---------- 面板 ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
  .panel-h h2{font-size:13px;margin:0;font-weight:600}
  .panel-b{padding:14px}
  .panel-b.flush{padding:0}
  .panel-b.flush .tbl-wrap{border:0;border-radius:0;background:transparent}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  /* ---------- 节点详情 ---------- */
  .node-hero{
    position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;
  }
  .node-hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok)}
  .node-hero.warn::before{background:var(--warn)} .node-hero.crit::before{background:var(--crit)}
  .hero-title{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .hero-title h1{font-size:19px;margin:0;font-weight:600;overflow-wrap:anywhere}
  .hero-sub{font-size:11.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
  .hero-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-width:0}
  .kpi-k{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
  .kpi-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
  .kpi-s{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kvlist{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px;margin:0;font-size:12px}
  .kvlist dt{color:var(--muted);font-size:11px}
  .kvlist dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .policy-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}

  /* ---------- 图表 ---------- */
  .cgroup{margin-bottom:16px}
  .cgroup-h{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin:0 0 8px}
  .cgroup-h .muted{font-size:10.5px;opacity:.7}
  .chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px 7px}
  .chart:hover{border-color:var(--line-2)}
  .chart-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12px;color:var(--dim)}
  .chart-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chart-r{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .chart-v{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}
  .chart-time{font-size:10.5px;color:var(--muted)}
  .chart-c{height:92px;margin-top:5px}
  .chart-f{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px}
  .spark{width:100%;height:100%;display:block;overflow:visible}
  .spark .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
  .spark .cursor{stroke:rgba(230,238,247,.55);stroke-width:1;vector-effect:non-scaling-stroke}
  .chart-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}

  /* ---------- IO 明细 ---------- */
  .io-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .io-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);margin:0 0 6px}
  .io-h .muted{font-size:10.5px;margin-left:6px}
  .io-proc-name{display:inline-block;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .dt-hide{display:none}
  .dt-block{min-width:0}
  .io-h .dt-toggle{flex:none}
  .dt-toggle{font-size:11px;padding:3px 10px;height:auto}
  th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  th.sortable:hover{color:var(--fg)}
  th.sortable.asc::after{content:" ↑";color:var(--accent)}
  th.sortable.desc::after{content:" ↓";color:var(--accent)}
  @media (max-width:1180px){.io-grid{grid-template-columns:1fr}}

  /* ---------- 右侧浮动目录 ---------- */
  .toc{position:fixed;right:14px;top:calc(var(--topbar-h) + 16px);z-index:22;width:96px;
    background:rgba(20,26,33,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid rgba(47,60,74,.65);border-radius:10px;padding:7px 5px;
    display:flex;flex-direction:column;gap:1px;opacity:.72;transition:opacity .15s}
  .toc:hover{opacity:1}
  .toc.is-hidden{display:none}
  .toc .toc-a{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
    font:inherit;font-size:11px;color:var(--dim);padding:4px 8px;border-radius:6px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toc .toc-a:hover{background:var(--panel-2);color:var(--fg)}
  .toc .toc-a.on{color:var(--fg);background:rgba(76,154,255,.16);box-shadow:inset 2px 0 0 var(--accent)}
  body.has-toc main{padding-right:116px}
  [id^="sec"]{scroll-margin-top:calc(var(--topbar-h) + 12px)}
  @media (max-width:1000px){.toc{display:none} body.has-toc main{padding-right:18px}}

  /* ---------- 标签页 ---------- */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-2px 0 14px}
  .tab{
    background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);
    padding:8px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .tab:hover{color:var(--fg)}
  .tab.on{color:var(--fg);border-bottom-color:var(--accent)}
  .page-intro{
    font-size:12px;color:var(--dim);margin-bottom:14px;padding:10px 12px;
    background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:8px;
  }
  .filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .chipset{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
  .chip-btn{
    background:transparent;border:0;color:var(--muted);font-family:inherit;font-size:11.5px;
    padding:4px 10px;border-radius:6px;cursor:pointer;
  }
  .chip-btn:hover{color:var(--fg)}
  .chip-btn.on{background:var(--panel-3);color:var(--fg)}

  /* ---------- 策略表单 ---------- */
  .chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px 12px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap}
  .chk input{width:auto;accent-color:var(--accent);margin:0}
  .polrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;align-items:center}

<script>
"use strict";
/* ============================== 基础工具 ============================== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v) => (v === undefined || v === null || v === "" || isNaN(v)) ? null : Number(v);
const fmt = (v, d) => { const n = num(v); return n === null ? "-" : n.toFixed(d === undefined ? 1 : d); };
const fmtInt = (v) => { const n = num(v); return n === null ? "-" : Math.round(n).toLocaleString("zh-CN"); };
const pct = (v) => { const n = num(v); return n === null ? "-" : n.toFixed(1) + "%"; };
const fmtMB = (v) => {
  const n = num(v);
  if (n === null) return "-";
  return Math.abs(n) >= 1024 ? (n / 1024).toFixed(2) + " GB" : n.toFixed(0) + " MB";
};
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function fmtBps(v){
  const n = num(v);
  if (n === null) return "-";
  const a = Math.abs(n);
  if (a >= 1e9) return (n/1e9).toFixed(2) + " Gbps";
  if (a >= 1e6) return (n/1e6).toFixed(2) + " Mbps";
  if (a >= 1e3) return (n/1e3).toFixed(1) + " Kbps";
  return n.toFixed(0) + " bps";
}
function fmtBytesRate(v){
  const n = num(v);
  if (n === null) return "-";
  const a = Math.abs(n);
  if (a >= 1073741824) return (n/1073741824).toFixed(2) + " GiB/s";
  if (a >= 1048576) return (n/1048576).toFixed(2) + " MiB/s";
  if (a >= 1024) return (n/1024).toFixed(1) + " KiB/s";
  return n.toFixed(0) + " B/s";
}
function fmtUptime(s){
  const n = num(s);
  if (n === null || n <= 0) return "-";
  const t = Math.round(n);
  const d = Math.floor(t/86400), h = Math.floor(t%86400/3600), m = Math.floor(t%3600/60);
  if (d) return d + "d " + h + "h";
  if (h) return h + "h " + m + "m";
  return m + "m";
}
function fmtDur(s){
  const n = num(s);
  if (n === null || !isFinite(n)) return "-";
  if (n < 60) return Math.max(0, Math.round(n)) + "s";
  if (n < 3600) return Math.floor(n/60) + "m";
  if (n < 86400) return Math.floor(n/3600) + "h " + Math.floor(n%3600/60) + "m";
  return Math.floor(n/86400) + "d " + Math.floor(n%86400/3600) + "h";
}
function fmtTime(ts){
  if (!ts) return "-";
  const d = new Date(ts);
  if (isNaN(d.getTime()) || d.getFullYear() < 2000) return "-";
  return d.toLocaleString("zh-CN", {hour12:false});
}
function ago(ts){
  if (!ts) return "从未";
  const t = new Date(ts).getTime();
  if (isNaN(t)) return "从未";
  const s = Math.max(0, Math.floor((Date.now() - t)/1000));
  if (s < 60) return s + "s 前";
  if (s < 3600) return Math.floor(s/60) + "m 前";
  if (s < 86400) return Math.floor(s/3600) + "h 前";
  return Math.floor(s/86400) + "d 前";
}
function statusOf(ts){
  if (!ts) return "offline";
  const d = (Date.now() - new Date(ts).getTime())/1000;
  if (isNaN(d)) return "offline";
  return d < 60 ? "online" : (d < 300 ? "stale" : "offline");
}
function statusText(s){ return s === "online" ? "在线" : (s === "stale" ? "延迟" : "离线"); }

/* ============================== 图标 ============================== */
const ICONS = {
  overview: '<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
  nodes: '<rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
  alerts: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 20.5a2 2 0 0 1-3.4 0"/>',
  policies: '<path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-.01"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  add: '<circle cx="12" cy="12" r="9"/><path d="M12 8.5v7M8.5 12h7"/>',
  decisions: '<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
  ai: '<path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/>'
};
function icon(name){
  return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + '</svg>';
}

/* ============================== 常量与状态 ============================== */
const RANGES = [
  {v:900000, label:"最近 15 分钟", short:"15 分钟前"},
  {v:3600000, label:"最近 1 小时", short:"1 小时前"},

];
const AUTOS = [

  {v:15000, label:"每 15 秒"},
  {v:60000, label:"每 60 秒"},
  {v:0, label:"暂停刷新"}
];
const NAV = [
  {name:"overview", label:"概览", icon:"overview"},
  {name:"nodes", label:"节点", icon:"nodes"},
  {name:"alerts", label:"告警", icon:"alerts", badge:true},
  {name:"policies", label:"采集策略", icon:"policies"},
  {name:"add", label:"添加节点", icon:"add"},
  {name:"decisions", label:"决策日志", icon:"decisions"},
  {name:"ai", label:"AI 接入", icon:"ai"}
];

const POLICY_METRICS = [
  {k:"*", label:"全部指标"},
  {k:"cpu_pct", label:"CPU 使用率"},
  {k:"cpu_iowait_pct", label:"IO 等待"},
  {k:"mem_pct", label:"内存使用率"},
  {k:"mem_used_gb", label:"已用内存"},
  {k:"swap_pct", label:"Swap 使用率"},
  {k:"load1", label:"负载 1m"},
  {k:"load5", label:"负载 5m"},
  {k:"load15", label:"负载 15m"},
  {k:"net_rx_bps", label:"网络接收"},
  {k:"net_tx_bps", label:"网络发送"},
  {k:"proc_count", label:"进程数"},
  {k:"uptime_s", label:"运行时长"},
  {k:"temp:*", label:"温度"},
  {k:"disk_used_pct:*", label:"磁盘使用率"},
  {k:"disk_free_gb:*", label:"磁盘空闲"}
];

const MLABEL = {
  cpu_pct:"CPU 使用率", cpu_iowait_pct:"IO 等待", mem_pct:"内存使用率", swap_pct:"Swap 使用率",
  mem_used_gb:"已用内存", load1:"负载 1m", load5:"负载 5m", load15:"负载 15m",
  net_rx_bps:"网络接收", net_tx_bps:"网络发送", proc_count:"进程数", uptime_s:"运行时长",
  disk_read_bytes_s:"磁盘读", disk_write_bytes_s:"磁盘写",
  disk_read_iops:"读 IOPS", disk_write_iops:"写 IOPS", disk_util_pct:"磁盘忙碌",
  probe_ok:"可达性", probe_latency_ms:"探测延迟", http_ok:"HTTP 可用性",
  http_latency_ms:"HTTP 延迟", http_status:"HTTP 状态码",
  snmp_cpu_pct:"SNMP CPU", snmp_uptime_s:"SNMP 运行时长"
};

let token = localStorage.getItem("sentinel_token") || "";

const state = {
  route: {name:"overview"},
  hosts: [], total: 0, online: 0,
  events: [],
  policies: {global:null, hosts:[]},
  nodeInfo: null,
  decisions: [],
  range: 3600000,
  autoMs: 5000,
  search: "",
  alertFilter: {status:"", severity:""},
  pageSig: "",
  nodeMetricsKey: "",
  nodeExtraSig: "",
  nodeDetailSig: "",
  updatedAt: 0,
  connected: true
};
let timer = null;
let hoverCard = null;

/* ============================== 指标语义 ============================== */
function metricLabel(k){
  if (MLABEL[k]) return MLABEL[k];
  if (k.startsWith("disk_used_pct:")) return "磁盘使用 " + k.slice(14);
  if (k.startsWith("disk_free_gb:")) return "磁盘空闲 " + k.slice(13);
  if (k.startsWith("temp:")) return "温度 " + k.slice(5);
  if (k.startsWith("port_open:")) return "端口 " + k.slice(10) + " 开放";
  if (k.startsWith("if_in_bps:")) return "接口 " + k.slice(10) + " 接收";
  if (k.startsWith("if_out_bps:")) return "接口 " + k.slice(11) + " 发送";
  if (k.startsWith("if_oper_up:")) return "接口 " + k.slice(11) + " 状态";
  return k;
}
function miniLabel(k){
  if (k === "cpu_pct") return "CPU";
  if (k === "mem_pct") return "内存";
  if (k.startsWith("disk_used_pct:")) return "磁盘 " + k.slice(14);
  if (k === "net_rx_bps") return "网络";
  if (k === "probe_ok") return "可达";
  if (k === "probe_latency_ms") return "延迟";
  if (k === "http_ok") return "HTTP";
  if (k === "http_latency_ms") return "延迟";
  return metricLabel(k);
}
function metricValue(k, v){
  const n = num(v);
  if (n === null) return "-";
  if (k === "disk_read_bytes_s" || k === "disk_write_bytes_s") return fmtBytesRate(n);
  if (k === "disk_read_iops" || k === "disk_write_iops") return n.toFixed(1) + " IOPS";
  if (k === "disk_util_pct") return n.toFixed(1) + "%";
  if (k === "uptime_s" || k === "snmp_uptime_s") return fmtUptime(n);
  if (k === "proc_count") return fmtInt(n);
  if (k === "probe_ok") return n >= 1 ? "可达" : "超时";
  if (k === "http_ok") return n >= 1 ? "可用" : "不可用";
  if (k.startsWith("port_open:")) return n >= 1 ? "开放" : "关闭";
  if (k.startsWith("if_oper_up:")) return n >= 1 ? "up" : "down";
  if (k === "http_status") return String(Math.round(n));
  if (k.endsWith("_latency_ms")) return n.toFixed(1) + " ms";
  if (k.endsWith("_pct")) return n.toFixed(1) + "%";
  if (k === "mem_used_gb" || k.startsWith("disk_free_gb:")) return n.toFixed(2) + " GB";
  if (k.endsWith("_bps")) return fmtBps(n);
  if (k.startsWith("temp:")) return n.toFixed(1) + " °C";
  return n.toFixed(2);
}
function metricColor(k){
  if (k === "cpu_pct") return "#4c9aff";
  if (k === "cpu_iowait_pct") return "#f0a92b";
  if (k === "mem_pct") return "#2ecc71";
  if (k === "mem_used_gb") return "#34d399";
  if (k === "swap_pct") return "#f0a92b";
  if (k.startsWith("load")) return "#a78bfa";
  if (k.startsWith("disk_used_pct")) return "#38bdf8";
  if (k.startsWith("disk_free_gb")) return "#22d3ee";
  if (k === "net_rx_bps" || k.startsWith("if_in_bps:")) return "#4c9aff";
  if (k === "net_tx_bps" || k.startsWith("if_out_bps:")) return "#f472b6";
  if (k === "disk_read_bytes_s") return "#4c9aff";
  if (k === "disk_write_bytes_s") return "#f472b6";
  if (k === "disk_read_iops" || k === "disk_write_iops") return "#a78bfa";
  if (k === "disk_util_pct") return "#f0a92b";
  if (k.startsWith("temp:")) return "#fb923c";
  if (k.endsWith("_latency_ms")) return "#f0a92b";
  if (k === "probe_ok" || k === "http_ok" || k.startsWith("port_open:") || k.startsWith("if_oper_up:")) return "#2ecc71";
  if (k === "proc_count" || k === "uptime_s" || k === "snmp_uptime_s") return "#8aa0b6";
  return "#8aa0b6";
}
const KEY_ORDER = ["cpu_pct","cpu_iowait_pct","load1","load5","load15","mem_pct","swap_pct","mem_used_gb",
  "net_rx_bps","net_tx_bps","disk_read_bytes_s","disk_write_bytes_s","disk_read_iops","disk_write_iops","disk_util_pct",
  "probe_ok","probe_latency_ms","http_ok","http_latency_ms","http_status","proc_count","uptime_s"];
function metricRank(k){
  const i = KEY_ORDER.indexOf(k);
  if (i >= 0) return i;
  if (k.startsWith("disk_used_pct:")) return 100;
  if (k.startsWith("disk_free_gb:")) return 110;
  if (k.startsWith("if_in_bps:")) return 210;
  if (k.startsWith("if_out_bps:")) return 220;
  if (k.startsWith("if_oper_up:")) return 230;
  if (k.startsWith("port_open:")) return 240;
  if (k.startsWith("temp:")) return 300;
  return 500;
}
function groupMetrics(m){
  const keys = Object.keys(m).sort((a, b) => metricRank(a) - metricRank(b) || a.localeCompare(b));
  const sys = ["cpu_pct","cpu_iowait_pct","load1","load5","load15"];
  const mem = ["mem_pct","swap_pct","mem_used_gb"];
  const probe = ["probe_ok","probe_latency_ms","http_ok","http_latency_ms","http_status"];
  const io = ["disk_read_bytes_s","disk_write_bytes_s","disk_read_iops","disk_write_iops","disk_util_pct"];
  const known = new Set([].concat(sys, mem, probe, io, ["proc_count","uptime_s"]));
  const groups = [
    {name:"系统与 CPU", keys: keys.filter(k => sys.includes(k))},
    {name:"内存", keys: keys.filter(k => mem.includes(k))},
    {name:"磁盘", keys: keys.filter(k => k.startsWith("disk_") && !io.includes(k))},
    {name:"网络", keys: keys.filter(k => k.startsWith("net_") || k.startsWith("if_"))},
    {name:"磁盘 IO", keys: keys.filter(k => io.includes(k))},
    {name:"探测", keys: keys.filter(k => probe.includes(k) || k.startsWith("port_open:"))},
    {name:"温度与进程", keys: keys.filter(k => k.startsWith("temp:") || k === "proc_count" || k === "uptime_s" || k === "snmp_uptime_s")},
    {name:"其他", keys: keys.filter(k => !known.has(k) && !k.startsWith("disk_") && !k.startsWith("net_") && !k.startsWith("if_") && !k.startsWith("temp:") && !k.startsWith("port_open:"))}
  ];
  return groups.filter(g => g.keys.length);
}
function miniMetrics(m){
  const out = [];
  if (m.cpu_pct !== undefined) out.push("cpu_pct");
  if (m.mem_pct !== undefined) out.push("mem_pct");
  const disk = Object.keys(m).find(k => k.startsWith("disk_used_pct:"));
  if (disk) out.push(disk);
  if (m.net_rx_bps !== undefined) out.push("net_rx_bps");
  if (!out.length){
    if (m.probe_ok !== undefined) out.push("probe_ok","probe_latency_ms");
    else if (m.http_ok !== undefined) out.push("http_ok","http_latency_ms");
    else out.push.apply(out, Object.keys(m).slice(0, 2));
  }
  return out.slice(0, 4);
}

/* ============================== API ============================== */
function api(path){
  const h = token ? {"Authorization":"Bearer " + token} : {};
  return fetch(path, {headers:h, cache:"no-store"}).then(r => {
    if (r.status === 401){ showAuth(); throw new Error("unauthorized"); }
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  });
}
function apiSend(method, path, body){
  const h = {"Content-Type":"application/json"};
  if (token) h["Authorization"] = "Bearer " + token;
  return fetch(path, {method:method, headers:h, body: body ? JSON.stringify(body) : undefined, cache:"no-store"}).then(r => {
    if (r.status === 401){ showAuth(); throw new Error("unauthorized"); }
    if (!r.ok) return r.text().then(t => { throw new Error((t || ("HTTP " + r.status)).slice(0, 200)); });
    return r.json();
  });
}
function showAuth(){ $("auth").style.display = "flex"; const i = $("token"); i.value = token; i.focus(); i.select(); }
function saveToken(){
  token = $("token").value.trim();
  localStorage.setItem("sentinel_token", token);
  $("auth").style.display = "none";
  sparkBuf.clear(); inflight.clear();
  state.pageSig = "";
  refresh(true);
}
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 6000);
}
async function copyText(text, okMsg){
  try{
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    toast(okMsg);
  }catch(e){ toast("复制失败，请手动选择文本"); }
}

/* ============================== 图表数据缓冲 ============================== */
const sparkBuf = new Map();
const inflight = new Set();

function rangeShortLabel(){
  const r = RANGES.find(x => x.v === state.range);
  return r ? r.short : "";
}
function downsample(pts, max){
  if (!pts || pts.length <= max) return pts || [];
  const out = [];
  const step = (pts.length - 1) / (max - 1);
  for (let i = 0; i < max; i++) out.push(pts[Math.round(i*step)]);
  return out;
}
function seriesLimit(){
  return state.range >= 86400000 ? 240 : (state.range >= 21600000 ? 200 : 160);
}
async function ensureSparks(pairs){
  const tasks = [];
  for (const pair of pairs || []){
    const host = pair[0], metric = pair[1];
    if (!host || !metric) continue;
    const key = host + "|" + metric;
    if (sparkBuf.has(key) || inflight.has(key)) continue;
    inflight.add(key);
    tasks.push(async () => {
      const to = new Date();
      const from = new Date(Date.now() - state.range);
      try{
        const d = await api("/api/v1/hosts/" + encodeURIComponent(host) + "/metrics?metric=" + encodeURIComponent(metric) +
          "&from=" + encodeURIComponent(from.toISOString()) + "&to=" + encodeURIComponent(to.toISOString()) + "&limit=" + seriesLimit());
        sparkBuf.set(key, (d.points || []).map(p => ({ts: new Date(p.ts).getTime(), v: Number(p.v)})));
      }catch(e){
        sparkBuf.set(key, []);
      }finally{
        inflight.delete(key);
      }
    });
  }
  for (let i = 0; i < tasks.length; i += 6){
    await Promise.all(tasks.slice(i, i + 6).map(fn => fn()));
  }
}
function appendSparksFromHosts(){
  const now = Date.now();
  for (const entry of state.hosts){
    const m = (entry.host && entry.host.metrics) || {};
    const prefix = entry.host.id + "|";
    for (const kv of sparkBuf){
      const key = kv[0];
      if (key.indexOf(prefix) !== 0) continue;
      const metric = key.slice(prefix.length);
      const v = m[metric];
      if (v === undefined || v === null) continue;
      const pts = kv[1];
      const last = pts[pts.length - 1];
      if (last && now - last.ts < 3000){ last.v = Number(v); continue; }
      pts.push({ts: now, v: Number(v)});
      if (pts.length > 600) pts.splice(0, pts.length - 600);
    }
  }
}

let gradSeq = 0;
function chartSVG(points, opt){
  const o = Object.assign({color:"#4c9aff", mini:false}, opt || {});
  const pts = downsample(points, o.mini ? 64 : 180);
  if (!pts || pts.length < 2) return '<div class="chart-empty">' + (pts && pts.length === 1 ? "采样中…" : "暂无数据") + "</div>";
  const W = 300, H = o.mini ? 44 : 92, P = o.mini ? 3 : 6;
  let min = Infinity, max = -Infinity;
  for (const p of pts){ if (p.v < min) min = p.v; if (p.v > max) max = p.v; }
  if (!isFinite(min) || !isFinite(max)) return '<div class="chart-empty">暂无数据</div>';
  if (min === max){ const d = Math.abs(min) || 1; min -= d; max += d; }
  const pad = (max - min) * 0.1;
  min -= pad; max += pad;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const span = (t1 - t0) || 1;
  const X = (t) => t1 === t0 ? W/2 : ((t - t0)/span)*W;
  const Y = (v) => H - P - ((v - min)/(max - min))*(H - 2*P);
  let d = "";
  for (let i = 0; i < pts.length; i++){
    d += (i ? "L" : "M") + X(pts[i].ts).toFixed(2) + "," + Y(pts[i].v).toFixed(2);
  }
  const area = "M" + X(t0).toFixed(2) + "," + H + " " + d.replace(/^M/, "L") + " L" + X(t1).toFixed(2) + "," + H + " Z";
  const gid = "sp" + (++gradSeq);
  const grid = o.mini ? "" : [0.25, 0.5, 0.75].map(r =>
    '<line class="grid" x1="0" y1="' + (H*r).toFixed(1) + '" x2="' + W + '" y2="' + (H*r).toFixed(1) + '"/>').join("");
  const cursor = o.mini ? "" : '<line class="cursor" x1="0" y1="0" x2="0" y2="' + H + '" opacity="0"/>';
  return '<svg class="spark" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + o.color + '" stop-opacity=".32"/>' +
    '<stop offset="100%" stop-color="' + o.color + '" stop-opacity="0"/></linearGradient></defs>' +
    grid +
    '<path d="' + area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + o.color + '" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + X(t1).toFixed(2) + '" cy="' + Y(pts[pts.length-1].v).toFixed(2) + '" r="' + (o.mini ? 1.8 : 2.3) + '" fill="' + o.color + '"/>' +
    cursor +
    "</svg>";
}
function paintSparks(){
  const nodes = document.querySelectorAll("[data-spark]");
  for (const node of nodes){
    const key = node.dataset.spark;
    const metric = key.slice(key.indexOf("|") + 1);
    const big = node.dataset.big === "1";
    node.innerHTML = chartSVG(sparkBuf.get(key) || [], {color: metricColor(metric), mini: !big});
  }
}
function onChartMove(e){
  const card = e.target && e.target.closest ? e.target.closest(".chart[data-metric]") : null;
  if (!card) return;
  const holder = card.querySelector("[data-spark]");
  if (!holder) return;
  const pts = sparkBuf.get(holder.dataset.spark) || [];
  if (pts.length < 2) return;
  const rect = holder.getBoundingClientRect();
  if (!rect.width || e.clientX < rect.left || e.clientX > rect.right) return;
  const ratio = clamp((e.clientX - rect.left)/rect.width, 0, 1);
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const t = t0 + ratio*(t1 - t0);
  let best = 0, bd = Infinity;
  for (let i = 0; i < pts.length; i++){
    const dd = Math.abs(pts[i].ts - t);
    if (dd < bd){ bd = dd; best = i; }
  }
  const p = pts[best];
  const vEl = card.querySelector(".chart-v");
  const tEl = card.querySelector(".chart-time");
  if (vEl) vEl.textContent = metricValue(card.dataset.metric, p.v);
  if (tEl) tEl.textContent = new Date(p.ts).toLocaleTimeString("zh-CN", {hour12:false});
  const cur = holder.querySelector("svg .cursor");
  if (cur){
    const x = ((p.ts - t0)/((t1 - t0) || 1))*300;
    cur.setAttribute("x1", x.toFixed(1));
    cur.setAttribute("x2", x.toFixed(1));
    cur.setAttribute("opacity", "1");
  }
  hoverCard = card;
}
function resetHover(){
  if (!hoverCard) return;
  const vEl = hoverCard.querySelector(".chart-v");
  const tEl = hoverCard.querySelector(".chart-time");
  if (vEl && hoverCard.dataset.latest) vEl.textContent = hoverCard.dataset.latest;
  if (tEl) tEl.textContent = "";
  const cur = hoverCard.querySelector("svg .cursor");
  if (cur) cur.setAttribute("opacity", "0");
  hoverCard = null;
}

function readPolicyForm(prefix){
  const root = document.getElementById(prefix + "-form");

  return {enabled_metrics: enabled, interval_s: interval, mounts: mounts};
}

    '</tr>').join("");

    '<th>节点 ID</th><th>探测目标</th><th>显示名称</th><th class="c-num">间隔</th><th>创建</th><th></th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>';

async function addProbeNode(){
  const address = (($("ap-addr") || {}).value || "").trim();
  if (!address){ toast("请填写 IP 或主机名"); return; }
  const port = parseInt(($("ap-port") || {}).value, 10);
  try{
    const r = await apiSend("POST", "/api/v1/nodes/probe", {
      address: address,
      name: (($("ap-name") || {}).value || "").trim(),
      port: isNaN(port) ? 0 : port
    });
    $("ap-addr").value = "";
    $("ap-name").value = "";
    toast("节点已添加：" + r.node.host_id + "，首次探测结果稍后出现");
    await loadNodeInfo();
    state.pageSig = "";
    renderPage(true);
    refresh(true);
  }catch(e){ if (e.message !== "unauthorized") toast("添加失败：" + e.message); }
}
async function deleteProbeNode(id){
  if (!confirm("移除节点 " + id + "？")) return;
  try{
    await apiSend("DELETE", "/api/v1/nodes/probe/" + encodeURIComponent(id));
    toast("已移除节点 " + id);
    await loadNodeInfo();
    state.pageSig = "";
    renderPage(true);
    refresh(true);
  }catch(e){ if (e.message !== "unauthorized") toast("移除失败：" + e.message); }
}

"3. 无新事件时每 5 分钟巡检：GET /healthz、last_seen 超时主机、长时间未关闭事件\n" +
"4. 重复事件合并输出，不刷屏\n" +
"5. 只读优先；任何变更按「授权与排障」策略执行并留痕";

function aiAuthText(){
  return "【授权分级】\n" +
"- 只读（查询、拉流、查看）：自动执行\n" +
"- 低风险（重载配置、调整采集策略）：写入 decisions 留痕后自动执行，每主机每小时最多 1 次\n" +

"【鉴权与错误处理】\n" +
"- 401：读取正确的 PANEL_TOKEN 重新鉴权，GET /healthz 通过后继续原任务\n" +
"- 403：停止该操作，记录 decisions 并升级人工\n" +
"- 429/5xx：指数退避 1s/2s/5s/10s，最多 4 次；仍失败则上报并保留现场\n" +
"- 重新授权成功后，在输出中说明「已自动重新授权」\n\n" +
"【排障顺序】\n" +
"GET /healthz → GET /api/v1/hosts 的 last_seen → 事件与 decisions → stream 中的 collector.failed → POST /api/v1/collectors/{id}/run\n\n" +
"【授权演练（可在测试环境执行）】\n" +
"1. 用错误 token 请求 /api/v1/hosts，应返回 401；AI 应自动换用正确 token 重试成功\n" +
"2. 停掉一个 probe 节点端口，等待 probe_down 事件；AI 应读取事件与指标并给出定位\n" +
"3. 让采集器指向不可达地址，观察 stream 中的 collector.failed 与 collector_failing 事件；AI 应手动触发采集并根据返回错误定位\n\n" +
"【自检脚本】\n" +
"BASE=" + aiBase() + "\n" +
"TOKEN=<PANEL_TOKEN>\n" +
"curl -s -H \"Authorization: Bearer $TOKEN\" $BASE/healthz\n" +

function switchAITab(tab){
  document.querySelectorAll("#aiTabs .tab").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));

    const el = $("ai-" + t);
    if (el) el.classList.toggle("is-hidden", t !== tab);
  });
}
async function copyAIText(which){

    which === "auth" ? "已复制授权与排障" : "已复制值守提示词");
}
async function runAuthSelfCheck(){
  const out = $("aiSelfCheck");
  if (!out) return;
  out.textContent = "检测中…";
  const results = [];
  try{
    const bad = await fetch(aiBase() + "/api/v1/hosts", {headers:{"Authorization":"Bearer wrong-token"}, cache:"no-store"});
    results.push("错误令牌 → HTTP " + bad.status + (bad.status === 401 ? " ✓" : "（未启用 PANEL_TOKEN）"));
  }catch(e){ results.push("错误令牌请求失败：" + e.message); }
  try{
    const h = {};
    if (token) h["Authorization"] = "Bearer " + token;
    const ok = await fetch(aiBase() + "/api/v1/hosts", {headers:h, cache:"no-store"});
    results.push("当前令牌 → HTTP " + ok.status + (ok.ok ? " ✓" : " ✗"));
  }catch(e){ results.push("当前令牌请求失败：" + e.message); }

}

function sortableValue(td, type){
  if (!td) return null;
  if (type === "text") return (td.textContent || "").trim().toLowerCase();
  const raw = td.dataset.v;
  if (raw !== undefined && raw !== ""){
    const n = num(raw);
    if (n !== null) return n;
  }
  const t = (td.textContent || "").trim();
  const m = t.match(/^(-?[\d,]+(?:\.\d+)?)\s*([KMG]i?B\/s|[KMG]i?B|bps|Kbps|Mbps|Gbps|%|ms)?/);
  if (!m) return null;
  let n = parseFloat(m[1].replace(/,/g, ""));
  if (isNaN(n)) return null;
  const mult = {
    "B/s": 1, "KiB/s": 1024, "MiB/s": 1048576, "GiB/s": 1073741824,
    "KB/s": 1000, "MB/s": 1e6, "GB/s": 1e9,
    "B": 1, "KiB": 1024, "MiB": 1048576, "GiB": 1073741824,
    "KB": 1000, "MB": 1e6, "GB": 1e9,
    "Kbps": 1e3, "Mbps": 1e6, "Gbps": 1e9
  }[m[2] || ""];
  if (mult) n *= mult;
  return n;
}
function sortTable(th){
  const table = th.closest("table");
  const block = th.closest(".dt-block");
  const tbody = table && table.querySelector("tbody");
  if (!tbody || !block) return;
  const idx = parseInt(th.dataset.sortIndex, 10);
  const type = th.dataset.sort || "text";
  let dir;
  if (!th.dataset.dir) dir = type === "num" ? "desc" : "asc";
  else dir = th.dataset.dir === "desc" ? "asc" : "desc";
  const rows = Array.from(tbody.querySelectorAll("tr"));
  const keyed = rows.map(tr => ({tr: tr, v: sortableValue(tr.children[idx], type)}));
  keyed.sort((a, b) => {
    let c;
    if (type === "num"){
      const av = a.v === null ? -Infinity : a.v;
      const bv = b.v === null ? -Infinity : b.v;
      c = av - bv;
    } else {
      c = String(a.v).localeCompare(String(b.v), "zh-CN", {numeric: true, sensitivity: "base"});
    }
    return dir === "asc" ? c : -c;
  });
  keyed.forEach(x => tbody.appendChild(x.tr));
  table.querySelectorAll("th.sortable").forEach(h => {
    h.dataset.dir = "";
    h.classList.remove("asc", "desc");
  });
  th.dataset.dir = dir;
  th.classList.add(dir);
  const btn = block.querySelector(".dt-toggle");
  const visible = parseInt(block.dataset.visible, 10) || 3;
  const expanded = btn ? btn.dataset.expanded === "1" : false;
  keyed.forEach((x, i) => x.tr.classList.toggle("dt-hide", !expanded && i >= visible));
}

    : "未启用";
  const kpis = '<div class="kpi-row" style="margin-bottom:14px">' +
    kpi("内存使用", pct(m.used_pct), "已用 " + fmtMB(m.used_mb) + " / " + fmtMB(m.total_mb), mbar(m.used_pct, 80, 92)) +
    kpi("可用", fmtMB(m.available_mb), "MemAvailable") +
    kpi("缓存", fmtMB(m.cached_mb), "Cached + Buffers") +
    kpi("Swap", swap, "交换分区") +
    '</div>';
  const procRows = procs.map(p => {
    const share = total > 0 ? (num(p.rss_mb) || 0) / total * 100 : null;
    return procName(p) +
      '<td class="c-num">' + esc(fmtMB(p.rss_mb)) + '</td>' +
      '<td class="c-num">' + esc(pct(share)) + '</td>' +
      '<td class="c-num">' + esc(fmt(p.cpu_pct, 1)) + '%</td>' +
      '<td class="muted">' + esc(p.state || "-") + '</td>';
  });
  return kpis + collapsibleTable(
    ['<th>进程</th>', '<th class="c-num">PID</th>', '<th class="c-num">内存</th>', '<th class="c-num">占比</th>', '<th class="c-num">CPU</th>', '<th>状态</th>'],
    procRows, {title:"内存占用进程", meta:"按 RSS 排序", empty:"暂无进程数据"});
}
function netDetailHTML(d){
  if (!d.ts) return detailEmpty(d, "网络");
  const n = d.net || {};
  const ifs = (n.interfaces || []).slice().sort((a, b) => (num(b.rx_bytes_s) + num(b.tx_bytes_s)) - (num(a.rx_bytes_s) + num(a.tx_bytes_s)));
  const kpis = '<div class="kpi-row" style="margin-bottom:14px">' +
    kpi("总接收", fmtBytesRate(n.rx_bytes_s), "不含 lo") +
    kpi("总发送", fmtBytesRate(n.tx_bytes_s), "不含 lo") +
    kpi("接口数", String(ifs.length), "含 lo") +
    '</div>';
  const rows = ifs.map(x =>
    '<td><b>' + esc(x.name) + '</b></td>' +
    '<td class="c-num">' + esc(fmtBytesRate(x.rx_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtBytesRate(x.tx_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtInt(x.rx_packets_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtInt(x.tx_packets_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtInt(x.rx_errors) + " / " + fmtInt(x.tx_errors)) + '</td>' +
    '<td class="c-num">' + esc(fmtInt(x.rx_drops) + " / " + fmtInt(x.tx_drops)) + '</td>');
  return kpis + collapsibleTable(
    ['<th>接口</th>', '<th class="c-num">接收</th>', '<th class="c-num">发送</th>',
     '<th class="c-num">收包/s</th>', '<th class="c-num">发包/s</th>',
     '<th class="c-num">错误(收/发)</th>', '<th class="c-num">丢包(收/发)</th>'],
    rows, {title:"网卡", meta:ifs.length + " 个", empty:"暂无网卡数据"});
}
function loadDetailHTML(d){
  if (!d.ts) return detailEmpty(d, "负载");
  const l = d.load || {};
  const blocked = (d.procs || []).filter(p => p.state === "D").sort((a, b) => num(b.cpu_pct) - num(a.cpu_pct));
  const kpis = '<div class="kpi-row" style="margin-bottom:14px">' +
    kpi("负载 1m", fmt(l.load1, 2), "load average") +
    kpi("负载 5m", fmt(l.load5, 2), "load average") +
    kpi("负载 15m", fmt(l.load15, 2), "load average") +
    kpi("运行 / 线程", (l.running || l.total_threads) ? (l.running + " / " + l.total_threads) : "-", "/proc/loadavg") +
    kpi("阻塞进程", String(l.blocked || 0), "D 状态") +
    '</div>';
  const rows = blocked.map(p => procName(p) +
    '<td class="c-num">' + esc(fmt(p.cpu_pct, 1)) + '%</td>' +
    '<td class="c-num">' + esc(fmtMB(p.rss_mb)) + '</td>' +
    '<td class="muted">' + esc(p.state || "D") + '</td>');
  return kpis + collapsibleTable(
    ['<th>进程</th>', '<th class="c-num">PID</th>', '<th class="c-num">CPU</th>', '<th class="c-num">内存</th>', '<th>状态</th>'],
    rows, {title:"阻塞进程", meta:"不可中断睡眠（D）", empty:"无阻塞进程"});
}
function ioDetailHTML(d){
  if (!d.ts) return detailEmpty(d, "IO");
  const io = d.io || {};
  const s = io.summary || {};
  const devs = io.devices || [];
  const procs = (d.procs || []).slice().sort((a, b) =>
    (num(b.read_bytes_s) + num(b.write_bytes_s)) - (num(a.read_bytes_s) + num(a.write_bytes_s)));
  const kpis = '<div class="kpi-row" style="margin-bottom:14px">' +
    kpi("磁盘读", fmtBytesRate(s.read_bytes_s), fmt(s.read_iops, 1) + " IOPS") +
    kpi("磁盘写", fmtBytesRate(s.write_bytes_s), fmt(s.write_iops, 1) + " IOPS") +
    kpi("最忙设备", pct(s.util_pct), "设备忙碌度", mbar(s.util_pct, 70, 90)) +
    kpi("进程数", fmtInt(s.proc_count), "采样于 " + ago(d.ts)) +
    '</div>';
  const devRows = devs.map(x =>
    '<td><b>' + esc(x.name) + '</b></td>' +
    '<td class="c-num">' + esc(fmtBytesRate(x.read_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtBytesRate(x.write_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmt(x.read_iops, 1)) + '</td>' +
    '<td class="c-num">' + esc(fmt(x.write_iops, 1)) + '</td>' +
    '<td class="c-num">' + pctCell(x.util_pct, 70, 90) + '</td>' +
    '<td class="c-num">' + esc(fmt(x.await_ms, 2)) + ' ms</td>' +
    '<td class="c-num">' + esc(fmt(x.queue, 2)) + '</td>');
  const procRows = procs.map(p => procName(p) +
    '<td class="c-num">' + esc(fmtBytesRate(p.read_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmtBytesRate(p.write_bytes_s)) + '</td>' +
    '<td class="c-num">' + esc(fmt(p.cpu_pct, 1)) + '%</td>' +
    '<td class="c-num">' + esc(fmtMB(p.rss_mb)) + '</td>' +
    '<td class="muted">' + esc(p.state || "-") + '</td>');
  return kpis + '<div class="io-grid">' +
    '<div>' + collapsibleTable(['<th>设备</th>', '<th class="c-num">读</th>', '<th class="c-num">写</th>',
        '<th class="c-num">读 IOPS</th>', '<th class="c-num">写 IOPS</th>',
        '<th class="c-num">忙碌</th>', '<th class="c-num">延迟</th>', '<th class="c-num">队列</th>'],
        devRows, {title:"磁盘设备", meta:devs.length + " 块 · 不含分区", empty:"暂无设备 IO 数据"}) + '</div>' +
    '<div>' + collapsibleTable(['<th>进程</th>', '<th class="c-num">PID</th>', '<th class="c-num">读</th>', '<th class="c-num">写</th>',
        '<th class="c-num">CPU</th>', '<th class="c-num">内存</th>', '<th>状态</th>'],
        procRows, {title:"热点进程", meta:"按读写排序", empty:"暂无进程 IO 数据（macOS 仅提供设备 IO）"}) + '</div>' +
    '</div>';
}
function renderNodeDetail(d){
  const set = (id, html) => { const el = $(id); if (el) el.innerHTML = html; };
  set("nodeCPU", cpuDetailHTML(d));
  set("nodeMem", memDetailHTML(d));
  set("nodeNet", netDetailHTML(d));
  set("nodeLoad", loadDetailHTML(d));
  set("nodeIO", ioDetailHTML(d));
}
async function loadNodeDetail(id){
  if (!id) return;
  try{
    const d = await api("/api/v1/hosts/" + encodeURIComponent(id) + "/detail");
    if (state.route.name !== "node" || state.route.id !== id) return;
    const sig = JSON.stringify(d);
    if (sig === state.nodeDetailSig) return;
    state.nodeDetailSig = sig;
    renderNodeDetail(d);
  }catch(e){
    if (e.message === "unauthorized") return;
    ["nodeCPU", "nodeMem", "nodeNet", "nodeLoad", "nodeIO"].forEach(k => {
      const el = $(k);
      if (el) el.innerHTML = '<div class="empty">加载明细失败：' + esc(e.message) + '</div>';
    });
  }
}
async function loadNodeExtras(id){
  try{
    const res = await Promise.all([
      api("/api/v1/events?host=" + encodeURIComponent(id) + "&limit=50"),
      api("/api/v1/decisions?host=" + encodeURIComponent(id) + "&limit=50")
    ]);
    if (state.route.name !== "node" || state.route.id !== id) return;
    const sig = JSON.stringify([res[0].events || [], res[1].decisions || []]);
    if (sig === state.nodeExtraSig) return;
    state.nodeExtraSig = sig;
    if ($("nodeAlerts")) $("nodeAlerts").innerHTML = alertsTable(res[0].events || [], {host:false, emptyText:"该节点暂无告警"});
    if ($("nodeDecisions")) $("nodeDecisions").innerHTML = decisionsTable(res[1].decisions || []);
  }catch(e){ if (e.message !== "unauthorized") toast("加载节点详情失败：" + e.message); }
}
function updateNodePage(){
  const id = state.route.id;
  const entry = hostEntry(id);
  if (!entry){
    toast("节点已不存在");
    location.hash = "#/nodes";
    return;
  }
  if ($("nodeHead")) $("nodeHead").innerHTML = nodeHeadHTML(entry);
  if ($("nodeKpis")) $("nodeKpis").innerHTML = nodeKpiHTML(entry);
  if ($("nodeMeta")) $("nodeMeta").innerHTML = nodeMetaHTML(entry);
  const mkey = Object.keys(entry.host.metrics || {}).sort().join(",") + "|" + state.range;
  if (mkey !== state.nodeMetricsKey){
    state.nodeMetricsKey = mkey;
    if ($("nodeCharts")) $("nodeCharts").innerHTML = nodeChartsHTML(entry);
    ensureSparks(Object.keys(entry.host.metrics || {}).map(k => [entry.host.id, k])).then(paintSparks);
  }
  const m = entry.host.metrics || {};
  document.querySelectorAll("#nodeCharts .chart[data-metric]").forEach(card => {
    const k = card.dataset.metric;
    const val = metricValue(k, m[k]);
    const b = card.querySelector(".chart-v");
    if (b) b.textContent = val;
    card.dataset.latest = val;
  });
  loadNodeDetail(id);
  loadNodeExtras(id);
}
function refreshNodeCharts(){
  const entry = hostEntry(state.route.id);
  if (!entry) return;
  Object.keys(entry.host.metrics || {}).forEach(k => sparkBuf.delete(entry.host.id + "|" + k));
  state.nodeMetricsKey = "";
  state.nodeDetailSig = "";
  updateNodePage();
  paintSparks();
  toast("正在重新拉取曲线…");
}

/* ============================== 路由 / 刷新 ============================== */
function parseHash(){
  let raw = location.hash.replace(/^#/, "");
  try{ raw = decodeURIComponent(raw); }catch(e){}
  if (!raw || raw === "/" || raw === "/overview") return {name:"overview"};
  if (raw.indexOf("host=") === 0) return {name:"node", id: raw.slice(5)};
  const parts = raw.replace(/^\//, "").split("/").filter(Boolean);
  if (!parts.length) return {name:"overview"};
  if (parts[0] === "node" && parts[1]) return {name:"node", id: parts[1]};
  if (PAGES[parts[0]]) return {name: parts[0]};
  return {name:"overview"};
}
async function enterNode(id){
  state.route = {name:"node", id:id};
  state.nodeMetricsKey = "";
  state.nodeExtraSig = "";
  state.nodeDetailSig = "";
  if (!hostEntry(id)){
    try{
      const h = await api("/api/v1/hosts/" + encodeURIComponent(id));
      state.hosts.unshift({host:h, status: statusOf(h.last_seen), open_events:0, max_severity:""});
    }catch(e){
      if (e.message !== "unauthorized") toast("加载节点失败：" + e.message);
      location.hash = "#/nodes";
      return;
    }
  }
  await loadPolicies();
  state.nodeExtraSig = "";
}
async function route(){
  const r = parseHash();
  const changed = r.name !== state.route.name || (r.id || "") !== (state.route.id || "");
  state.route = r;
  state.pageSig = "";
  toggleSidebar(false);
  if (changed) window.scrollTo({top:0});
  try{
    if (r.name === "node" && r.id) await enterNode(r.id);
    else if (r.name === "policies") await loadPolicies();
    else if (r.name === "decisions") await loadDecisions();
    else if (r.name === "add") await loadNodeInfo();
  }catch(e){ /* 已由各自函数提示 */ }
  renderPage(true);
}

async function refresh(){
  try{
    const res = await Promise.all([
      api("/api/v1/hosts"),
      api("/api/v1/events?limit=200")
    ]);
    const hosts = res[0], events = res[1];
    state.hosts = hosts.hosts || [];
    state.total = hosts.total || 0;
    state.online = hosts.online || 0;
    state.events = events.events || [];
    state.updatedAt = Date.now();
    state.connected = true;
    appendSparksFromHosts();
    updateChrome();
    if (state.route.name === "node" && state.route.id) updateNodePage();
    else renderPage(false);
    paintSparks();
    if (state.route.name === "decisions") loadDecisions().then(() => { state.pageSig = ""; renderPage(true); });
  }catch(err){
    state.connected = false;
    updateChrome();
    if (err.message !== "unauthorized") toast("刷新失败：" + err.message);
  }
}
function loop(){
  clearInterval(timer);
  refresh();
  if (state.autoMs > 0){
    timer = setInterval(() => { if (!document.hidden) refresh(); }, state.autoMs);
  }
}

/* ============================== 顶栏 / 侧栏交互 ============================== */
function buildNav(){
  $("nav").innerHTML = NAV.map(n =>
    '<a href="#/' + n.name + '" data-nav="' + n.name + '">' + icon(n.icon) +
    '<span class="nav-label">' + n.label + '</span>' +
    (n.badge ? '<span class="nav-badge" id="navBadge" style="display:none">0</span>' : "") +
    '</a>').join("");
}
function buildSelects(){
  $("rangeSel").innerHTML = RANGES.map(r => '<option value="' + r.v + '">' + r.label + '</option>').join("");
  $("autoSel").innerHTML = AUTOS.map(a => '<option value="' + a.v + '">' + a.label + '</option>').join("");
  $("rangeSel").value = String(state.range);
  $("autoSel").value = String(state.autoMs);
}
function toggleCollapse(){
  document.body.classList.toggle("collapsed");
  localStorage.setItem("sentinel_collapsed", document.body.classList.contains("collapsed") ? "1" : "0");
}
function toggleSidebar(force){
  const open = typeof force === "boolean" ? force : !document.body.classList.contains("nav-open");
  document.body.classList.toggle("nav-open", open);
}
function openDialog(title, bodyHTML){
  $("overlayCard").innerHTML = '<div class="dlg-h"><h3>' + esc(title) + '</h3>' +
    '<button class="icon-btn" onclick="closeDialog()" title="关闭">✕</button></div>' +
    '<div class="dlg-b">' + bodyHTML + '</div>';
  $("overlay").classList.add("open");
}
function closeDialog(){ $("overlay").classList.remove("open"); }
function onRangeChange(v){
  const n = parseInt(v, 10);
  if (isNaN(n)) return;
  state.range = n;
  localStorage.setItem("sentinel_range", String(n));
  sparkBuf.clear(); inflight.clear();
  state.pageSig = "";
  state.nodeMetricsKey = "";
  renderPage(true);
  if (state.route.name === "node") updateNodePage();
}
function onAutoChange(v){
  const n = parseInt(v, 10);
  state.autoMs = isNaN(n) ? 5000 : n;
  localStorage.setItem("sentinel_auto", String(state.autoMs));
  loop();
}

/* ============================== 事件绑定 ============================== */
function bind(){
  $("rangeSel").addEventListener("change", e => onRangeChange(e.target.value));
  $("autoSel").addEventListener("change", e => onAutoChange(e.target.value));
  let searchTimer = null;
  $("search").addEventListener("input", e => {
    state.search = e.target.value.trim();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.pageSig = "";
      renderPage(true);
    }, 150);
  });
  window.addEventListener("hashchange", () => route());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape"){
      if ($("overlay").classList.contains("open")){ closeDialog(); return; }
      if (document.body.classList.contains("nav-open")){ toggleSidebar(false); return; }
    }
    if (e.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)){
      e.preventDefault();
      if (!$("searchWrap").classList.contains("is-hidden")) $("search").focus();
    }
  });
  document.addEventListener("change", e => {
    const box = e.target;
    if (!box.matches || !box.matches(".chk-grid input[type=checkbox]")) return;
    const grid = box.closest(".chk-grid");
    const all = grid.querySelector('input[value="*"]');
    if (box.value === "*"){
      grid.querySelectorAll("input").forEach(i => { i.checked = box.checked; });
    } else if (all){
      all.checked = Array.prototype.slice.call(grid.querySelectorAll("input")).filter(i => i.value !== "*").every(i => i.checked);
    }
  });
  document.addEventListener("click", e => {
    const chip = e.target.closest ? e.target.closest(".chip-btn[data-group]") : null;
    if (!chip) return;
    state.alertFilter[chip.dataset.group] = chip.dataset.val;
    state.pageSig = "";
    renderPage(true);
  });
  document.addEventListener("click", e => {
    if (!e.target.closest) return;
    const toc = e.target.closest(".toc-a");
    if (toc){
      const el = $(toc.dataset.target);
      if (el) el.scrollIntoView({behavior: "smooth", block: "start"});
      return;
    }
    const th = e.target.closest("th.sortable");
    if (th){ sortTable(th); return; }
    const dt = e.target.closest(".dt-toggle");
    if (dt) toggleDetailRows(dt);
  });
  window.addEventListener("scroll", () => {
    if (tocRaf) return;
    tocRaf = requestAnimationFrame(() => { tocRaf = 0; updateTOCActive(); });
  }, {passive: true});
  document.addEventListener("mousemove", onChartMove);
  document.addEventListener("mouseout", e => {
    if (!hoverCard) return;
    if (e.relatedTarget && hoverCard.contains(e.relatedTarget)) return;
    resetHover();
  });
}

/* ============================== 启动 ============================== */
function boot(){
  buildNav();
  const savedRange = parseInt(localStorage.getItem("sentinel_range"), 10);
  if (RANGES.some(r => r.v === savedRange)) state.range = savedRange;
  const savedAuto = parseInt(localStorage.getItem("sentinel_auto"), 10);
  if (AUTOS.some(a => a.v === savedAuto)) state.autoMs = savedAuto;
  if (localStorage.getItem("sentinel_collapsed") === "1") document.body.classList.add("collapsed");
  buildSelects();
  bind();
  updateChrome();
  route().then(() => loop());
}
boot();
</script>
</body>
