name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross build
        run: make cross VERSION="${GITHUB_REF_NAME#v}"

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp bin/sentinel-linux-amd64 bin/sentinel-linux-arm64 dist/
          cp bin/sentinel-agent-linux-amd64 bin/sentinel-agent-linux-arm64 \
             bin/sentinel-agent-linux-armv7 bin/sentinel-agent-linux-386 \
             bin/sentinel-agent-darwin-amd64 bin/sentinel-agent-darwin-arm64 \
             bin/sentinel-agent-windows-amd64.exe dist/
          cd dist && sha256sum * > checksums.txt && ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push control plane image
        run: |
          IMG="$REGISTRY/${{ github.repository_owner }}/lan-sentinel"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.release \
            -t "$IMG:${{ github.ref_name }}" -t "$IMG:latest" .

      - name: Push agent image
        run: |
          IMG="$REGISTRY/${{ github.repository_owner }}/lan-sentinel-agent"
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            -f Dockerfile.agent.release \
            -t "$IMG:${{ github.ref_name }}" -t "$IMG:latest" .

      - name: Summary
        run: |
          echo "### LanSentinel ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Images: \`$REGISTRY/${{ github.repository_owner }}/lan-sentinel:${{ github.ref_name }}\` / \`...-agent:${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
