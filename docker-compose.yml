services:
  sentinel:
    image: ${SENTINEL_IMAGE:-lan-sentinel:0.2.0}
    container_name: lan-sentinel
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SENTINEL_LISTEN: ":8110"
      CONFIG_DIR: /config
      DATA_DIR: /data
      TZ: Asia/Shanghai
    ports:
      - "8110:8110"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    mem_limit: 192m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "/sentinel", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # Unraid 自身也当被监控机：pid=host 只读挂载 /proc、/sys、/，不装系统服务
  agent:
    image: ${SENTINEL_AGENT_IMAGE:-lan-sentinel-agent:0.2.0}
    container_name: lan-sentinel-agent
    restart: unless-stopped
    pid: host
    network_mode: host
    env_file:
      - .env
    environment:
      SENTINEL_SERVER: http://127.0.0.1:8110
      SENTINEL_TOKEN: ${AGENT_TOKEN:-}
      SENTINEL_HOST_ID: unraid
    command: ["-mounts", "/host/root,/host/root/mnt/user", "-data-dir", "/data"]
    volumes:
      - /:/host/root:ro
      - /sys:/sys:ro
      - ./agent/data:/data
    mem_limit: 32m
    cpus: 0.05
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
